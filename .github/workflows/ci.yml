name: PostgreSQL Lab CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Check benchmark parser tests
        run: python -m unittest discover -s tests -v
      - name: Start disposable PostgreSQL instance
        run: docker compose up -d --wait
      - name: Execute benchmark and validate rows
        run: bash scripts/benchmark.sh
      - name: Summarize actual PostgreSQL plans
        run: python scripts/summarize_plans.py
      - name: Upload original plans and machine-readable summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-explain-plans
          path: |
            results/*.txt
            results/*.json
          if-no-files-found: ignore
      - name: Stop demo database
        if: always()
        run: docker compose down -v
